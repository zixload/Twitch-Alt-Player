# Le relais du synchroniseur (modules/sync.js) : un salon = un Durable Object.
name = "tw5-sync"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Les Durable Objects adosses a SQLite sont ceux du plan gratuit.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
